<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            text-align: center;
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        } 

        .cnome {
            background-color: greenyellow;
        }

        .csexo {
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <h1>Exercicio de tabela</h1>

    <caption>Cadastro</caption>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof"> 
        </colgroup>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>João</td>
            <td>M</td>
            <td>26</td>
            <td>Jogador</td>
        </tr>
        <tr>
            <td>Sergio</td>
            <td>M</td>
            <td>23</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>19</td>
            <td>Farmaceutica</td>
        </tr>
        <tr>
            <td>Lucas</td>
            <td>M</td>
            <td>29</td>
            <td>Mecânico</td>
        </tr>
    </table>
</body>
</html>
