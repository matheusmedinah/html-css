 <!DOCTYPE html>
 <html lang="pt-br">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia e HTML5</title>
 </head>
 <body>
    <h1>IMAGENS DINAMICAS</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexivel">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5 </p>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/ten-anno.mp3" type="audio/mpeg">
        <p>Infelizmente o seu navegador nao permite reproduzir audio. <a href="midia/ten-anno.mp3">Clique aqui para fazer o download do arquivo MP3</a>
        </p>
    </audio>
    
 </body>
 </html>
