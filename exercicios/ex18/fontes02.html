<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        
        @font-face {
            font-family: 'angelia';
            src: url(fontes/Angelia\ Beauty.ttf) format(truetype);
            font-weight: normal;
            font-style: normal;
            
            /*
            tipos de format()
            -opentype (otf)
            -truetype (ttf)
            -embedded-opentype 
            -truetype-aat (Apple Advcanded Typography)
            -svg
            */

        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(to right, yellow, white);
        }
        h1{
            font-family: 'angelia', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Voluptatem, impedit quasi? Perspiciatis, perferendis ad unde, eos recusandae eveniet esse exercitationem minus fugiat iure sapiente debitis excepturi. Ipsum laboriosam architecto similique.</p>
</body>
</html>
